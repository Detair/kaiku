# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# =============================================================================
# Advisories - Check for known vulnerabilities
# =============================================================================
[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # rsa crate Marvin Attack - no safe upgrade available, used by openidconnect
    "RUSTSEC-2023-0071",
    # rand unsoundness with custom `log` logger — flagged against rand 0.7.3,
    # 0.8.5, 0.9.2, AND 0.10.0 (all versions; the underlying API contract
    # hasn't changed). Not exploitable in Kaiku because we use `tracing` /
    # `tracing-subscriber`, not the `log` facade. The exploitable
    # configuration requires a `log::Log` implementation that calls
    # `rand::thread_rng()` (or its v0.9+ equivalent `rand::rng()`) during
    # logging, which does not exist in this codebase. Transitive deps (fred,
    # jsonwebtoken, openidconnect, webrtc, sqlx-postgres, vodozemac, etc.)
    # pin various rand majors across the tree; bumping our direct rand
    # version wouldn't drop the transitive copies. The ignore stays
    # version-agnostic because the rationale (no log facade in our code) is
    # invariant across rand majors.
    "RUSTSEC-2026-0097",
    # zip <9.0.0 extraction flaws (2026-10-22): SUID/SGID bits preserved
    # (0367), symlinks escaping the destination (0368), Unix permissions
    # applied through symlinks (0369). Our own server dep is on zip 9 (fixed)
    # and only *writes* archives (governance export). The remaining copies
    # cannot be bumped without a major migration:
    # - zip 3 is a build-dependency of utoipa-swagger-ui 9 (10.x needs
    #   utoipa 6). Its build.rs uses its own enclosed_name() loop, not
    #   ZipArchive::extract, on the pinned Swagger UI dist archive — trusted,
    #   build-time input only.
    # - zip 4 is used by tauri-plugin-updater 2.x (all 2.x pin zip ^4) on
    #   Windows only, extracting update bundles after minisign signature
    #   verification. Windows has no SUID/SGID or Unix-mode semantics.
    # Re-check when tauri-plugin-updater 3 is stable / utoipa 6 migration.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

# =============================================================================
# Licenses - Only allow permissive licenses
# =============================================================================
[licenses]
confidence-threshold = 0.93

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "IJG",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# =============================================================================
# Bans - Disallow specific crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

deny = [
    # Disallow AGPL-licensed Signal library
    { name = "libsignal-protocol" },
]

# =============================================================================
# Sources - Only allow crates.io
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
