# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# =============================================================================
# Advisories - Check for known vulnerabilities
# =============================================================================
[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # zip < 9 aborts on a crafted symlink entry in ZipArchive::extract
    # (RUSTSEC-2026-0429, 2026-11-02). Still pulled by utoipa-swagger-ui 9
    # (build script only: copies entries of the Swagger UI release archive
    # via by_index/enclosed_name and never calls ZipArchive::extract; v10
    # needs utoipa 6) and tauri-plugin-updater 2.10 (extracts update bundles
    # only after their minisign signature is verified; the client only calls
    # downloadAndInstall). Remove with the utoipa 6 / Tauri updater upgrade.
    "RUSTSEC-2026-0429",
    # actix-http 3.12.1 / actix-web 4.13.0 (2026-11-11): RUSTSEC-2026-0446
    # (chunked trailer smuggling), -0447 (compressed request bodies), -0448
    # (unbounded decompression), -0455 (Brotli window limit). The crates are
    # only in Cargo.lock: they are an optional dependency of utoipa-swagger-ui
    # 9 (its `actix-web` feature, which we do not enable; we use `axum`) and
    # are not compiled for any target. Proof:
    #   cargo tree --locked --offline --target all -i actix-http
    # prints nothing. Fixes need actix-web >=4.18.2 / actix-http >=3.20.3,
    # which utoipa-swagger-ui 9 does not allow to lock; 10.x needs utoipa 6.
    # Remove with the utoipa 6 / utoipa-swagger-ui 10 migration.
    "RUSTSEC-2026-0446",
    "RUSTSEC-2026-0447",
    "RUSTSEC-2026-0448",
    "RUSTSEC-2026-0455",
    # libsqlite3-sys 0.36.0 bundles SQLite <3.54 (RUSTSEC-2026-0459 /
    # CVE-2026-119375, 2026-11-11): a database opened together with a -wal
    # file of a different page size can return uninitialized memory. Fix is
    # libsqlite3-sys >=0.39 (rusqlite 0.41), but sqlx-sqlite 0.9.0 (latest)
    # requires libsqlite3-sys <0.38 and both share the native `sqlite3`
    # links key, so rusqlite cannot move alone. Only the desktop client
    # (vc-client, rusqlite for the local E2EE store) is affected; it opens
    # only its own database in the app data dir, never a file from another
    # party. Remove when sqlx accepts libsqlite3-sys 0.39+ and rusqlite is
    # bumped to 0.41 together with it.
    "RUSTSEC-2026-0459",
    # rsa crate Marvin Attack - no safe upgrade available, used by openidconnect
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.5 timing variability (RUSTSEC-2026-0387, 2026-10-24).
    # Fixed only in 0.7.6; 0.5 is pulled by the elliptic-curve 0.13 stack
    # (p256/p384) of webrtc-dtls, jsonwebtoken and openidconnect, none of which
    # support elliptic-curve 0.14 yet. Kaiku signs JWTs with EdDSA (ed25519),
    # OIDC uses public-key verification only; residual exposure is DTLS ECDHE
    # ephemeral keys (P-256 on webrtc-rs<->webrtc-rs handshakes, i.e. desktop
    # <-> SFU; browsers negotiate X25519). Long-term fix: webrtc-rs 0.21
    # (rustls/ring based DTLS, no p256/p384). Re-check when dtls/jsonwebtoken/openidconnect move to
    # elliptic-curve 0.14. vc-server also uses p256 0.13 directly to verify
    # device signatures (C26) on public inputs only (public keys, messages and
    # signatures sent by the device); it never signs or holds a private key.
    # Re-check when LP brings the 0.14 stack.
    "RUSTSEC-2026-0387",
    # rand unsoundness with custom `log` logger — flagged against rand 0.7.3,
    # 0.8.5, 0.9.2, AND 0.10.0 (all versions; the underlying API contract
    # hasn't changed). Not exploitable in Kaiku because we use `tracing` /
    # `tracing-subscriber`, not the `log` facade. The exploitable
    # configuration requires a `log::Log` implementation that calls
    # `rand::thread_rng()` (or its v0.9+ equivalent `rand::rng()`) during
    # logging, which does not exist in this codebase. Transitive deps (fred,
    # jsonwebtoken, openidconnect, webrtc, sqlx-postgres, vodozemac, etc.)
    # pin various rand majors across the tree; bumping our direct rand
    # version wouldn't drop the transitive copies. The ignore stays
    # version-agnostic because the rationale (no log facade in our code) is
    # invariant across rand majors.
    "RUSTSEC-2026-0097",
    # zip <9.0.0 extraction flaws (2026-10-22): SUID/SGID bits preserved
    # (0367), symlinks escaping the destination (0368), Unix permissions
    # applied through symlinks (0369). Our own server dep is on zip 9 (fixed)
    # and only *writes* archives (governance export). The remaining copies
    # cannot be bumped without a major migration:
    # - zip 3 is a build-dependency of utoipa-swagger-ui 9 (10.x needs
    #   utoipa 6). Its build.rs uses its own enclosed_name() loop, not
    #   ZipArchive::extract, on the pinned Swagger UI dist archive — trusted,
    #   build-time input only.
    # - zip 4 is used by tauri-plugin-updater 2.x (all 2.x pin zip ^4) on
    #   Windows only, extracting update bundles after minisign signature
    #   verification. Windows has no SUID/SGID or Unix-mode semantics.
    # Re-check when tauri-plugin-updater 3 is stable / utoipa 6 migration.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

# =============================================================================
# Licenses - Only allow permissive licenses
# =============================================================================
[licenses]
confidence-threshold = 0.93

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "IJG",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# =============================================================================
# Bans - Disallow specific crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

deny = [
    # Disallow AGPL-licensed Signal library
    { name = "libsignal-protocol" },
]

# =============================================================================
# Sources - Only allow crates.io
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
