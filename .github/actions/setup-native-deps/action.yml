name: Setup native build dependencies
description: >-
  Installs the native libraries the Tauri client needs (GTK/WebKit, ALSA,
  Opus, libvpx, PipeWire, clang) on Linux, Windows and macOS runners.
  Shared by ci.yml (tauri), tauri-build.yml and release.yml (build-tauri)
  so the three workflows cannot drift apart.

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libasound2-dev \
          libvpx-dev \
          libpipewire-0.3-dev \
          libssl-dev \
          clang \
          libclang-dev \
          patchelf \
          libopus-dev

    - name: Install libvpx and pkg-config (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        vcpkg install libvpx:x64-windows-static-md
        # pkgconfiglite ships from SourceForge with no checksum; Chocolatey
        # now blocks empty checksums on non-secure sources by default.
        choco install -y pkgconfiglite --allow-empty-checksums

    - name: Set VPX environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
        # env-libvpx-sys links "libvpx" but vcpkg names it "vpx.lib"
        Copy-Item "$root\lib\vpx.lib" "$root\lib\libvpx.lib" -ErrorAction SilentlyContinue
        "VPX_LIB_DIR=$root\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VPX_INCLUDE_DIR=$root\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VPX_VERSION=1.15.2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VPX_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # CMake 4.x (now on macOS and Windows runner images) removed compat
    # with cmake_minimum_required < 3.5; audiopus_sys's bundled Opus needs this
    - name: Set CMake policy floor (macOS/Windows)
      if: runner.os == 'macOS' || runner.os == 'Windows'
      shell: bash
      run: echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install pkg-config libvpx

    # macOS runner images rotate Xcode versions; build-script outputs cache
    # absolute toolchain paths (e.g. -lclang_rt.osx with -L .../clang/<N>/
    # lib/darwin), so a cargo cache built under one Xcode fails to link
    # under another ("ld: library 'clang_rt.osx' not found"). Callers pass
    # XCODE_CACHE_KEY to Swatinem/rust-cache so image rollouts start fresh.
    - name: Compute Xcode cache key (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: echo "XCODE_CACHE_KEY=$(xcodebuild -version | tr -d ' \n')" >> "$GITHUB_ENV"
