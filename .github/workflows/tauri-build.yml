name: Tauri Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux
            allow_failure: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
            allow_failure: true
          - os: macos-15-intel
            target: ""
            artifact: macos-intel
            allow_failure: true
          - os: macos-latest
            target: ""
            artifact: macos-arm
            allow_failure: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-native-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      # XCODE_CACHE_KEY is exported by setup-native-deps on macOS (empty
      # elsewhere) so Xcode image rotations start a fresh cargo cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: ${{ env.XCODE_CACHE_KEY }}

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      # PR builds never sign: tauri.ci.conf.json turns off updater artifacts,
      # so no signing key is needed (release.yml owns signed builds).
      - name: Build Tauri app (targeted)
        if: matrix.target != ''
        working-directory: client
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json --target ${{ matrix.target }}

      - name: Build Tauri app (native)
        if: matrix.target == ''
        working-directory: client
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json

      # Upload artifacts
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
