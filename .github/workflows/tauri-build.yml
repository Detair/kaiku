name: Tauri Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled to free the scarce macOS runners;
# pushes to main/develop always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux
            allow_failure: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows
            allow_failure: false
          - os: macos-15-intel
            target: ""
            artifact: macos-intel
            allow_failure: true
          - os: macos-latest
            target: ""
            artifact: macos-arm
            allow_failure: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-native-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      # XCODE_CACHE_KEY is exported by setup-native-deps on macOS (empty
      # elsewhere) so Xcode image rotations start a fresh cargo cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/src-tauri
          key: ${{ env.XCODE_CACHE_KEY }}

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      # PR builds never sign: tauri.ci.conf.json turns off updater artifacts,
      # so no signing key is needed (release.yml owns signed builds).
      - name: Build Tauri app (targeted)
        if: matrix.target != ''
        working-directory: client
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json --target ${{ matrix.target }}

      - name: Build Tauri app (native)
        if: matrix.target == ''
        working-directory: client
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json

      # Upload artifacts
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voicechat-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
