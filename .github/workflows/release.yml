name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build unsigned, publish nothing'
        required: false
        type: boolean
        default: true

# Read-only by default; jobs that write get their own grants.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SERVER_IMAGE: ghcr.io/detair/kaiku-server

jobs:
  # ===========================================================================
  # Prepare Release Metadata
  # ===========================================================================
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      publish: ${{ steps.mode.outputs.publish }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Exit 2 on an invalid tag fails the run before anything is built.
      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        # No pipe: the default shell has no pipefail, so `| tee` would mask exit 2.
        run: |
          python3 scripts/release_version.py parse "$TAG" > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env" >> "$GITHUB_OUTPUT"

      # Publish on a tag push, or on a dispatch with dry_run unticked.
      - name: Decide publish or dry run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"

      - name: Verify version files and tag commit
        if: steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/release_version.py check --tag "$TAG"
          tag_commit=$(git rev-parse "$TAG^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::Tag $TAG points at $tag_commit but the run checked out $head_commit"
            exit 1
          fi

      - name: Generate standardized release notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/generate_release_notes.py --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          delim="NOTES_$(openssl rand -hex 8)"
          {
            echo "release_notes<<$delim"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build Tauri Client (Multi-platform)
  # ===========================================================================
  # Secrets live in Environment 'release' and are only read on publish runs;
  # a dry run gets no environment, so every secret expression below is ''.
  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: prepare-release
    environment: ${{ needs.prepare-release.outputs.publish == 'true' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # One row per target: a single `tauri build` produces every bundle
        # for that target. MSI is not built: WiX rejects non-numeric
        # pre-release versions (-rc.N) and the updater prefers *-setup.exe.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ needs.prepare-release.outputs.publish == 'true' && 'publish' || 'dry-run' }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The repo scripts call python3; Windows runners only ship `python`.
      - name: Provide python3 (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/python3-shim"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/python3-shim/python3"
          chmod +x "$RUNNER_TEMP/python3-shim/python3"
          echo "$RUNNER_TEMP/python3-shim" >> "$GITHUB_PATH"

      # Dry runs build an untagged commit; stamp the requested version so the
      # artifacts are named and report it exactly like a real release would.
      - name: Stamp dry-run version
        if: needs.prepare-release.outputs.publish != 'true'
        run: sh scripts/bump-version.sh "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-native-deps

      # XCODE_CACHE_KEY is exported by setup-native-deps on macOS (empty
      # elsewhere) so Xcode image rotations start a fresh cargo cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.XCODE_CACHE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      # Updater signing: required on publish, skipped (tauri.ci.conf.json
      # turns createUpdaterArtifacts off) on a dry run.
      - name: Check updater signing key
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare-release.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: python3 scripts/require_secrets.py --mode "$MODE" --output updater --step "updater signing" TAURI_SIGNING_PRIVATE_KEY

      # macOS signing hook (off until MACOS_SIGNING_ENABLED == 'true').
      # Disabled: ad-hoc signing (identity "-"), which Apple Silicon needs to
      # launch at all. Enabled: Tauri reads the APPLE_* variables natively.
      - name: macOS signing hook
        id: macsign
        if: runner.os == 'macOS'
        env:
          ENABLED: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
          APPLE_CERTIFICATE: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare-release.outputs.publish == 'true' && vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "$ENABLED" = true ]; then
            python3 scripts/require_secrets.py --mode "$MODE" --output macsign --step "macOS signing" \
              APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          else
            echo "macsign=false" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -qx 'macsign=true' "$GITHUB_OUTPUT"; then
            echo "::notice::macOS build is ad-hoc signed; Gatekeeper will warn (set MACOS_SIGNING_ENABLED, see docs/ops/release-runbook.md)"
          fi

      # Windows signing hook (off until WINDOWS_SIGNING_ENABLED == 'true').
      # The enabled path signs through Azure Trusted Signing and is not yet
      # exercised by any run.
      - name: Windows signing hook
        id: winsign
        if: runner.os == 'Windows'
        env:
          ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
          AZURE_CLIENT_ID: ${{ needs.prepare-release.outputs.publish == 'true' && vars.WINDOWS_SIGNING_ENABLED == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ needs.prepare-release.outputs.publish == 'true' && vars.WINDOWS_SIGNING_ENABLED == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ needs.prepare-release.outputs.publish == 'true' && vars.WINDOWS_SIGNING_ENABLED == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ "$ENABLED" = true ]; then
            python3 scripts/require_secrets.py --mode "$MODE" --output winsign --step "Windows signing" \
              AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
              AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT AZURE_TRUSTED_SIGNING_PROFILE
          else
            echo "winsign=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx 'winsign=true' "$GITHUB_OUTPUT"; then
            python3 scripts/write_winsign_config.py --output "$RUNNER_TEMP/tauri-winsign.json"
            echo "config=$RUNNER_TEMP/tauri-winsign.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Windows installer is unsigned; SmartScreen will warn"
          fi

      - name: Install trusted-signing-cli
        if: steps.winsign.outputs.winsign == 'true'
        env:
          # Latest on crates.io at implementation time (2026-10-22).
          TRUSTED_SIGNING_CLI_VERSION: "0.11.0"
        run: cargo install trusted-signing-cli --locked --version "$TRUSTED_SIGNING_CLI_VERSION"

      - name: Build Tauri app
        working-directory: client
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          UPDATER: ${{ steps.updater.outputs.updater }}
          WINSIGN_CONFIG: ${{ steps.winsign.outputs.config }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare-release.outputs.publish == 'true' && steps.updater.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare-release.outputs.publish == 'true' && steps.updater.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # "-" = ad-hoc signature on macOS when the signing hook is off.
          APPLE_SIGNING_IDENTITY: ${{ needs.prepare-release.outputs.publish == 'true' && steps.macsign.outputs.macsign == 'true' && secrets.APPLE_SIGNING_IDENTITY || (runner.os == 'macOS' && '-' || '') }}
          AZURE_CLIENT_ID: ${{ needs.prepare-release.outputs.publish == 'true' && steps.winsign.outputs.winsign == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ needs.prepare-release.outputs.publish == 'true' && steps.winsign.outputs.winsign == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ needs.prepare-release.outputs.publish == 'true' && steps.winsign.outputs.winsign == 'true' && secrets.AZURE_TENANT_ID || '' }}
        run: |
          # tauri-bundler checks these for presence, not content: an empty
          # APPLE_CERTIFICATE would trigger a keychain import of nothing and
          # defeat ad-hoc signing. Unset every empty optional signing var.
          # (TAURI_SIGNING_PRIVATE_KEY_PASSWORD stays: empty = no password.)
          for var in TAURI_SIGNING_PRIVATE_KEY \
              APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
              AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          config=()
          if [ "$UPDATER" != true ]; then
            config+=(--config src-tauri/tauri.ci.conf.json)
          fi
          if [ -n "$WINSIGN_CONFIG" ]; then
            config+=(--config "$WINSIGN_CONFIG")
          fi
          bun run tauri build --target "$BUILD_TARGET" --bundles "$BUNDLES" "${config[@]}"

      - name: Generate checksums
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cd "target/$BUILD_TARGET/release/bundle"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256() { sha256sum "$@"; }
          else
            sha256() { shasum -a 256 "$@"; }
          fi
          shopt -s nullglob
          files=(deb/*.deb appimage/*.AppImage nsis/*.exe dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer bundles found for $BUILD_TARGET"
            exit 1
          fi
          # Bare file names: checksums.txt is checked against the downloaded
          # release assets, which sit flat in one directory.
          : > checksums.txt
          for f in "${files[@]}"; do
            (cd "$(dirname "$f")" && sha256 "$(basename "$f")") >> checksums.txt
          done
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 7

  # ===========================================================================
  # Build Server Docker Image
  # ===========================================================================
  build-docker:
    name: Build and Push Docker Image
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        # Only publish runs push; dry runs never need registry credentials.
        if: needs.prepare-release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          # latest only for final releases (R-08); release candidates get only their version.
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare-release.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.source=https://github.com/Detair/kaiku

      # Build once into the local daemon and smoke-test it before anything is pushed.
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          push: false
          tags: kaiku-server:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - binary runs and no config is baked in
        run: |
          set -euo pipefail
          # Without env vars the server must fail on the first required variable.
          # `docker run` exits non-zero here, so capture the output instead of piping.
          out="$(docker run --rm kaiku-server:smoke 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "DATABASE_URL must be set"

      - name: Smoke test - image contents
        run: |
          set -euo pipefail
          listing="$(docker run --rm --entrypoint /bin/sh kaiku-server:smoke -c 'ls -A /app')"
          echo "$listing"
          test "$listing" = "$(printf 'migrations\nvc-server')"

      - name: Smoke test - version label
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          label="$(docker image inspect kaiku-server:smoke \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          echo "version label: $label"
          test "$label" = "$VERSION"

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          # Only publish runs push; a dry run (even dispatched on a tag ref) just builds.
          push: ${{ needs.prepare-release.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Publish GitHub Release
  # ===========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-tauri, build-docker]
    # Only publish runs (tag push, or dispatch with dry_run unticked) publish.
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Find and copy all built packages
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-assets/ \;

          # Updater signatures for Linux/Windows travel with their installers
          find artifacts -type f \( -name "*.AppImage.sig" -o -name "*.exe.sig" \) -exec cp {} release-assets/ \;

          # macOS updater bundles are named identically for both
          # architectures (Kaiku.app.tar.gz) — disambiguate by the build
          # target found in the artifact path.
          for arch in x86_64 aarch64; do
            src=$(find artifacts -path "*${arch}-apple-darwin*" -name "*.app.tar.gz" | head -1)
            if [ -n "$src" ]; then
              name="$(basename "${src%.app.tar.gz}")-${arch}.app.tar.gz"
              cp "$src" "release-assets/$name"
              [ -f "${src}.sig" ] && cp "${src}.sig" "release-assets/${name}.sig"
            fi
          done

          # Consolidate the per-target checksums (installers only)
          find artifacts -type f -name "checksums.txt" -exec cat {} \; > release-assets/checksums.txt

          # List what we're uploading
          ls -lah release-assets/

      # Fails the release if any platform lacks a signed updater bundle.
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          python3 scripts/generate_updater_manifest.py --assets-dir release-assets \
            --tag "$TAG" --repo Detair/kaiku --mode publish --output release-assets/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          body: |
            ${{ needs.prepare-release.outputs.release_notes }}

            ## Installation

            ### Linux
            - **Debian/Ubuntu**: Download the `.deb` file and install with `sudo dpkg -i Kaiku_*_amd64.deb`
            - **Other distros**: Download the `.AppImage` file, make it executable, and run it
            - Linux: use the AppImage for auto-updates

            ### Windows
            - **Installer**: Download the `-setup.exe` file for automatic installation

            ### macOS
            - Download the `.dmg` file for your architecture (Intel or Apple Silicon)
            - Open the DMG and drag the app to Applications

            ### Verify checksums
            ```bash
            sha256sum -c checksums.txt
            ```

            ## Server Deployment
            Server image: `${{ env.SERVER_IMAGE }}:${{ needs.prepare-release.outputs.version }}`
          draft: true
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
          fail_on_unmatched_files: false
