name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Prepare Release Metadata
  # ===========================================================================
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF_VALUE#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Check if prerelease
        id: check_prerelease
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate docs governance consistency
        run: python3 scripts/check_docs_governance.py

      - name: Generate standardized release notes
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python3 scripts/generate_release_notes.py --version "$VERSION" --output /tmp/release-notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Build Tauri Client (Multi-platform)
  # ===========================================================================
  build-tauri:
    name: Build Tauri (${{ matrix.target }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        # One row per target: a single `tauri build` produces every bundle
        # for that target. MSI is not built: WiX rejects non-numeric
        # pre-release versions (-rc.N) and the updater prefers *-setup.exe.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-native-deps

      # XCODE_CACHE_KEY is exported by setup-native-deps on macOS (empty
      # elsewhere) so Xcode image rotations start a fresh cargo cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.XCODE_CACHE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      - name: Build Tauri app
        working-directory: client
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # Required: bundle.createUpdaterArtifacts is enabled, so the build
          # signs updater bundles. Builds fail if the key is missing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: bun run tauri build --target "$BUILD_TARGET" --bundles "$BUNDLES"

      - name: Generate checksums
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cd "target/$BUILD_TARGET/release/bundle"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256() { sha256sum "$@"; }
          else
            sha256() { shasum -a 256 "$@"; }
          fi
          shopt -s nullglob
          files=(deb/*.deb appimage/*.AppImage nsis/*.exe dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer bundles found for $BUILD_TARGET"
            exit 1
          fi
          : > checksums.txt
          for f in "${files[@]}"; do
            (cd "$(dirname "$f")" && sha256 "$(basename "$f")") >> checksums.txt
          done
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 7

  # ===========================================================================
  # Build Server Docker Image
  # ===========================================================================
  build-docker:
    name: Build and Push Docker Image
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          # Only tag pushes publish; a workflow_dispatch run just builds.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Publish GitHub Release
  # ===========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-tauri, build-docker]
    # Only tag pushes publish; a workflow_dispatch run stops after the builds.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Find and copy all built packages
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-assets/ \;

          # Updater signatures for Linux/Windows travel with their installers
          find artifacts -type f \( -name "*.AppImage.sig" -o -name "*.exe.sig" -o -name "*.msi.sig" \) -exec cp {} release-assets/ \;

          # macOS updater bundles are named identically for both
          # architectures (Kaiku.app.tar.gz) — disambiguate by the build
          # target found in the artifact path.
          for arch in x86_64 aarch64; do
            src=$(find artifacts -path "*${arch}-apple-darwin*" -name "*.app.tar.gz" | head -1)
            if [ -n "$src" ]; then
              name="$(basename "${src%.app.tar.gz}")-${arch}.app.tar.gz"
              cp "$src" "release-assets/$name"
              [ -f "${src}.sig" ] && cp "${src}.sig" "release-assets/${name}.sig"
            fi
          done

          # Find and consolidate checksums
          find artifacts -type f -name "checksums.txt" -exec cat {} \; > release-assets/checksums.txt || true

          # List what we're uploading
          ls -lah release-assets/

      - name: Generate updater manifest (latest.json)
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python3 - <<'EOF'
          import datetime
          import glob
          import json
          import os

          tag = os.environ["VERSION"]
          base = f"https://github.com/Detair/kaiku/releases/download/{tag}"
          platforms = {}

          def add(key, *patterns):
              for pattern in patterns:
                  for path in sorted(glob.glob(f"release-assets/{pattern}")):
                      sig = path + ".sig"
                      if os.path.exists(sig):
                          with open(sig, encoding="utf-8") as f:
                              platforms[key] = {
                                  "signature": f.read().strip(),
                                  "url": f"{base}/{os.path.basename(path)}",
                              }
                          return

          add("linux-x86_64", "*.AppImage")
          add("windows-x86_64", "*-setup.exe", "*.msi")
          add("darwin-x86_64", "*x86_64.app.tar.gz")
          add("darwin-aarch64", "*aarch64.app.tar.gz")

          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"See https://github.com/Detair/kaiku/releases/tag/{tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .isoformat(timespec="seconds"),
              "platforms": platforms,
          }
          with open("release-assets/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          if not platforms:
              raise SystemExit("No signed updater artifacts found — check TAURI_SIGNING_PRIVATE_KEY")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.is_prerelease }}
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: Release ${{ needs.prepare-release.outputs.version }}
          body: |
            ${{ needs.prepare-release.outputs.release_notes }}

            ## Installation

            ### Linux
            - **Debian/Ubuntu**: Download the `.deb` file and install with `sudo dpkg -i canis_*.deb`
            - **Other distros**: Download the `.AppImage` file, make it executable, and run it

            ### Windows
            - **Installer**: Download the `-setup.exe` file for automatic installation

            ### macOS
            - Download the `.dmg` file for your architecture (Intel or Apple Silicon)
            - Open the DMG and drag the app to Applications

            ### Verify checksums
            ```bash
            sha256sum -c checksums.txt
            ```

            ## Server Deployment
            Docker images are available at: `ghcr.io/${{ github.repository }}/server:${{ needs.prepare-release.outputs.version }}`
          draft: true
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
          fail_on_unmatched_files: false
