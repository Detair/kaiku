name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs are cancelled to free the scarce macOS runners;
# pushes to main/develop get one group per commit, so every commit runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SERVER_IMAGE: ghcr.io/detair/kaiku-server

jobs:
  # ===========================================================================
  # Rust Linting (fmt + clippy)
  # ===========================================================================
  rust-lint:
    name: Rust Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [fmt, clippy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (nightly for fmt, stable for clippy)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.check == 'fmt' && 'nightly' || 'stable' }}
          components: ${{ matrix.check == 'fmt' && 'rustfmt' || 'clippy' }}

      - name: Install libvpx and bindgen prerequisites for env-libvpx-sys
        # Clippy compiles the workspace including the kaiku-vp8-decoder sub-crate,
        # whose env-libvpx-sys dep has a build.rs that calls pkg-config for the
        # system `vpx` library and (with the `generate` feature) runs bindgen
        # against the libvpx headers. Skip on fmt since rustfmt never invokes
        # build.rs.
        if: matrix.check == 'clippy'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvpx-dev clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-lint

      - name: Check formatting
        if: matrix.check == 'fmt'
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        if: matrix.check == 'clippy'
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-features --workspace --exclude vc-client -- -D warnings

  # ===========================================================================
  # Documentation Governance
  # ===========================================================================
  docs-governance:
    name: Docs Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docs governance consistency
        run: python3 scripts/check_docs_governance.py

      - name: Validate standardized release notes generation
        run: python3 scripts/generate_release_notes.py --version v0.0.0-ci --output /tmp/release-notes.md

      - name: Install script test dependencies
        run: python3 -m pip install --user pyyaml==6.0.2 || python3 -m pip install --user --break-system-packages pyyaml==6.0.2

      - name: Validate CI guardrails
        run: python3 scripts/check_ci_guardrails.py

      - name: Run script unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate release version consistency
        run: python3 scripts/release_version.py check

      - name: Validate compose hardening
        run: python3 scripts/check_compose_hardening.py

      - name: Test ops scripts
        run: bash infra/scripts/tests/run.sh

  # ===========================================================================
  # Rust Tests (with database services)
  # ===========================================================================
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/canis_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          large-packages: true
          docker-images: false
          tool-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install libvpx and bindgen prerequisites for env-libvpx-sys
        # cargo nextest compiles the workspace (including the kaiku-vp8-decoder
        # sub-crate), whose env-libvpx-sys dep requires pkg-config + system
        # libvpx at build time. The crate's `generate` feature (required
        # against libvpx >= 1.14, which Ubuntu 24.04 ships) runs bindgen
        # against the installed libvpx headers — that needs libclang plus a
        # clang toolchain that can find C stdlib headers (stddef.h etc.).
        # Without clang/libclang-dev, bindgen fails on `vpx_integer.h` →
        # `<stddef.h>` resolution.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvpx-dev clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test

      - name: Install sqlx-cli
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: sqlx-cli

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      - name: Run migrations
        run: sqlx migrate run --source server/migrations

      - name: Run tests
        timeout-minutes: 20
        run: cargo nextest run --all-features --workspace --exclude vc-client -j 4

      - name: Run integration tests (ignored, require DB/Valkey)
        if: always()
        timeout-minutes: 10
        run: cargo nextest run --all-features --workspace --exclude vc-client -j 2 --run-ignored ignored-only --no-fail-fast

  # ===========================================================================
  # License Check
  # ===========================================================================
  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

  # ===========================================================================
  # Secrets Scanning
  # ===========================================================================
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Observability Contract Checks
  # ===========================================================================
  observability-contract:
    name: Observability Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Metric name convention (kaiku_* prefix)
        run: |
          echo "Checking that declared metric instrument names start with kaiku_..."
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          content = pathlib.Path("server/src/observability/metrics.rs").read_text()
          pattern = re.compile(r"\.(?:u64_counter|f64_histogram)\(\"([^\"]+)\"\)")
          names = pattern.findall(content)

          if not names:
              print("ERROR: No metric instrument declarations found in metrics.rs")
              sys.exit(1)

          violations = [name for name in names if not name.startswith("kaiku_")]
          if violations:
              print("ERROR: Metric name convention check failed. Offending names:")
              for name in violations:
                  print(f" - {name}")
              sys.exit(1)

          print(f"OK: {len(names)} metric instrument names use the kaiku_* prefix.")
          PY

      - name: No sensitive fields in tracing instrumentation
        run: |
          echo "Checking for sensitive field names in tracing fields() or .record() calls..."
          VIOLATIONS=$(grep -rn --include="*.rs" \
            -E '(fields|record)\s*\([^)]*\b(password|token|secret|key|email)\b' \
            server/src/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Sensitive field names found in tracing instrumentation (must be in skip()):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK: No sensitive field names in tracing fields/record calls."

      - name: Required observability contract files present
        run: |
          echo "Checking required observability contract files..."
          FAILED=0
          for f in \
            docs/ops/observability-contract.md \
            server/src/observability/mod.rs \
            server/src/observability/tracing.rs \
            server/src/observability/metrics.rs; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 1 ] && exit 1
          echo "OK: All required observability contract files are present."

      - name: OTel resource attributes present in tracing.rs
        run: |
          echo "Checking OTel resource attribute keys in server/src/observability/tracing.rs..."
          FAILED=0
          if ! grep -qE '"service\.name"|with_service_name' server/src/observability/tracing.rs; then
            echo "ERROR: Missing resource attribute key: service.name"
            FAILED=1
          fi
          if ! grep -q '"service.version"' server/src/observability/tracing.rs; then
            echo "ERROR: Missing resource attribute key: service.version"
            FAILED=1
          fi
          if ! grep -q '"deployment.environment"' server/src/observability/tracing.rs; then
            echo "ERROR: Missing resource attribute key: deployment.environment"
            FAILED=1
          fi
          [ "$FAILED" -eq 1 ] && exit 1
          echo "OK: All required OTel resource attribute keys are present."
  # ===========================================================================
  # Frontend Checks
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      - name: Setup Node.js (required for jsdom in vitest)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint (fails on errors; warnings allowed)
        run: bun run lint

      - name: Check Tauri invoke registration
        working-directory: client
        run: bun run lint:tauri-commands

      - name: Check i18n catalogs
        working-directory: client
        run: bun run i18n:check

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=moderate

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Bundle size budget
        working-directory: .
        run: python3 scripts/check_bundle_budget.py

  # ===========================================================================
  # Build Server Docker Image
  # ===========================================================================
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [rust-lint, rust-test, licenses, docs-governance]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SERVER_IMAGE }}
          # Never latest: latest means the newest final release (see release.yml).
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Build Tauri Client (Multi-platform)
  # ===========================================================================
  tauri:
    name: Tauri ${{ matrix.platform }}
    needs: [rust-lint, rust-test, frontend, licenses, docs-governance]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: ubuntu-latest moved to 26.04, whose PipeWire headers
          # break libspa 0.8 bindings (spa_pod_builder fields). Same pin as
          # tauri-build.yml / release.yml until the pipewire crate is upgraded.
          - platform: ubuntu-24.04
            allow_failure: false
          - platform: windows-latest
            allow_failure: false
          - platform: macos-latest
            allow_failure: false
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-native-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.XCODE_CACHE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Install frontend dependencies
        working-directory: client
        run: bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)

      # PR builds never sign: tauri.ci.conf.json turns off updater artifacts,
      # so no signing key is needed (release.yml owns signed builds).
      - name: Build Tauri app
        working-directory: client
        run: bun run tauri build --config src-tauri/tauri.ci.conf.json

      # Rust unit tests of the desktop shell (session manager, native WebSocket).
      - name: Test Tauri client library (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: cargo test -p vc-client --lib

      - name: Upload artifacts (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  # ===========================================================================
  # Build Android App
  # ===========================================================================
  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [frontend, docs-governance]
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint rule tests
        run: ./gradlew :lint-rules:test --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Signing is enforced when required
        run: |
          if ./gradlew help -Pkaiku.requireReleaseSigning=true --no-daemon 2> err.txt; then
            echo "gradle succeeded without a keystore" >&2
            exit 1
          fi
          grep -q "Release signing required" err.txt

      - name: Release build (R8, ephemeral key)
        run: |
          P=$(openssl rand -hex 16)
          echo "::add-mask::$P"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Kaiku CI" \
            -storepass "$P" -keypass "$P" >/dev/null 2>&1
          export KAIKU_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ci.jks"
          export KAIKU_ANDROID_KEYSTORE_PASSWORD="$P"
          export KAIKU_ANDROID_KEY_ALIAS=ci
          export KAIKU_ANDROID_KEY_PASSWORD="$P"
          ./gradlew assembleRelease -Pkaiku.requireReleaseSigning=true --no-daemon
          NAME=$(sed -n 's/^versionName=//p' version.properties)
          CODE=$(sed -n 's/^versionCode=//p' version.properties)
          ../../scripts/android_verify_apk.sh app/build/outputs/apk/release/app-release.apk "$NAME" "$CODE"

      - name: Verifier rejects the debug APK
        run: |
          # Real version values, so only the debug signer can be the reason it fails.
          NAME=$(sed -n 's/^versionName=//p' version.properties)
          CODE=$(sed -n 's/^versionCode=//p' version.properties)
          if ../../scripts/android_verify_apk.sh app/build/outputs/apk/debug/app-debug.apk "$NAME" "$CODE" 2> verify-err.txt; then
            echo "verifier accepted the debug APK" >&2
            exit 1
          fi
          cat verify-err.txt
          grep -qF "signer is not the Android debug key" verify-err.txt

      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ci.jks"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaiku-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
