[package]
name = "vc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kaiku Desktop Client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["megolm"]
megolm = []
# Gates the VP8 decoder integration test (`tests/vp8_decode.rs`).
# Requires the captured fixture at `tests/fixtures/vp8_sample.rtp` and a
# working libvpx (via env-libvpx-sys). Off by default to keep `cargo test`
# fast and avoid forcing libvpx on machines that only run unit tests.
decode-integration = []

[dependencies]
# Internal
vc-common.workspace = true
vc-crypto = { workspace = true, features = ["megolm"] }

# Tauri
# tray-icon: system tray with menu (src/tray.rs); image-png: decode the
# bundled PNG icons for the tray at runtime
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Needed for relaunch() after an update is installed
tauri-plugin-process = "2"

# Async
tokio.workspace = true
futures.workspace = true

# WebRTC
webrtc.workspace = true
smol_str.workspace = true

# Audio
cpal = "0.17"
opus = "0.3"
rodio = "0.22"
# nnnoiseless = "0.5"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
base64 = "0.22"

# HTTP
reqwest = { version = "0.13", features = ["json"] }

# WebSocket
# rustls-tls-native-roots: `wss://` needs a TLS backend (OS trust store).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
# Both ring and aws-lc-rs end up enabled in this crate graph, so rustls cannot
# pick a provider by itself: the WebSocket client installs ring explicitly.
rustls.workspace = true
url = "2"

# Secure Storage
# We select the OS credential store ourselves (see src/keystore.rs) instead of
# depending on the `keyring` meta-crate: keyring 4 unconditionally pulls
# `db-keystore` -> turso -> tantivy/zstd (RUSTSEC-2026-0391/-0398/-0403/-0410)
# for a sqlite store we never use. The per-OS store crates below are exactly
# the ones `keyring::use_native_store(true)` selected, with the same features.
keyring-core = "1"
# rusqlite ≥ 0.33 requires sqlx ≥ 0.9 in the workspace: both link the native
# sqlite3 (cargo `links` key) via libsqlite3-sys, and sqlx 0.8's sqlx-sqlite
# pinned an incompatible version (#115). Keep the two in step when bumping.
rusqlite = { version = "0.38", features = ["bundled"] }

# Audio denoising + VAD
nnnoiseless = { version = "0.5", default-features = false }

# Screen capture
# Pinned to Detair/scap fork because upstream scap 0.1.0-beta.1 introduced a
# Frame enum restructure (Frame::Video(VideoFrame::*)) without updating the
# Linux pipewire backend, breaking the Linux build. Our fork (commit 4d1304e9)
# adapts the Linux backend to the new enum structure plus a Windows typo fix.
#
# Upstream tracking:
# - CapSoftware/scap#178 — broader fix, still open (last upstream update
#   2025-10-26)
# - Last re-check 2026-05-13: upstream latest release is still v0.1.0-beta.1
#   (2025-08-04). No new releases or merged Linux Frame enum fixes.
# - Previous re-check 2026-04-12: see closed PR #520 for the test run
# - Issue #521 tracks periodic re-checks — drop this git dep when upstream
#   publishes a new release with the Linux fix
scap = { git = "https://github.com/Detair/scap.git", branch = "fix/linux-frame-enum" }

# Webcam capture
nokhwa = { version = "0.10", features = ["input-native"] }

# Video encoding
vpx-encode = "0.6"
# Native VP8 decode path lives in a sub-crate so unsafe FFI is isolated from
# the workspace's `unsafe_code = "forbid"` policy. See client/src-tauri/vp8-decoder/.
kaiku-vp8-decoder = { path = "vp8-decoder" }

# Image encoding (thumbnails)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Process scanning
sysinfo = "0.39"

# Clipboard
arboard = "3"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2.workspace = true
getrandom = "0.2"
rand = "0.8"

# Zeroize
zeroize.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
sentry = { version = "0.48", features = ["tracing", "backtrace", "contexts", "panic"] }
sentry-tracing = "0.48"

# Linux tray-host detection (src/tray.rs, MIT). Already in the tree via
# notify-rust with these features, so no new crates are built.
[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (libsecret/D-Bus); kernel keyutils evicts on session end.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile.workspace = true
# HTTP mock server for the session manager tests (MIT/Apache-2.0)
wiremock = "0.6"
# Paused clock for the WebSocket watchdog test
tokio = { workspace = true, features = ["test-util"] }

# Layout checks for the PipeWire FFI bindings scap uses (capture/
# pipewire_ffi_tests.rs). Same crates scap already pulls in via pipewire 0.8
# (vendored under third_party/, see workspace [patch.crates-io]).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libspa-sys = "0.8"
pipewire-sys = "0.8"

[lints]
workspace = true

[lib]
name = "vc_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
