[package]
name = "vc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kaiku Desktop Client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["megolm"]
megolm = []

[dependencies]
# Internal
vc-common.workspace = true
vc-crypto = { workspace = true, features = ["megolm"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# Async
tokio.workspace = true
futures.workspace = true

# WebRTC
webrtc.workspace = true
smol_str.workspace = true

# Audio
cpal = "0.17"
opus = "0.3"
rodio = "0.22"
# nnnoiseless = "0.5"

# Serialization
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

# HTTP
reqwest = { version = "0.13", features = ["json"] }

# WebSocket
tokio-tungstenite.workspace = true
url = "2"

# Secure Storage
keyring = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio denoising + VAD
nnnoiseless = { version = "0.5", default-features = false }

# Screen capture
# Pinned to Detair/scap fork because upstream scap 0.1.0-beta.1 introduced a
# Frame enum restructure (Frame::Video(VideoFrame::*)) without updating the
# Linux pipewire backend, breaking the Linux build. Our fork (commit 4d1304e9)
# adapts the Linux backend to the new enum structure plus a Windows typo fix.
#
# Upstream PR that would fix this: https://github.com/CapSoftware/scap/pull/178
# (open since 2025-10-26, broader scope: adds sequence numbers + SystemTime +
# latest-buffer grab). Once merged and released, drop this git dep and pin to
# the next scap release. Track in #TODO (or file an issue).
scap = { git = "https://github.com/Detair/scap.git", branch = "fix/linux-frame-enum" }

# Webcam capture
nokhwa = { version = "0.10", features = ["input-native"] }

# Video encoding
vpx-encode = "0.3"

# Image encoding (thumbnails)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Process scanning
sysinfo = "0.38"

# Clipboard
arboard = "3"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2.workspace = true
getrandom = "0.2"

# Zeroize
zeroize.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
sentry = { version = "0.47", features = ["tracing", "backtrace", "contexts", "panic"] }
sentry-tracing = "0.47"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[lib]
name = "vc_client"
crate-type = ["staticlib", "cdylib", "rlib"]
