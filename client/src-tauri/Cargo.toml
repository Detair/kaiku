[package]
name = "vc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kaiku Desktop Client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["megolm"]
megolm = []
# Gates the VP8 decoder integration test (`tests/vp8_decode.rs`).
# Requires the captured fixture at `tests/fixtures/vp8_sample.rtp` and a
# working libvpx (via env-libvpx-sys). Off by default to keep `cargo test`
# fast and avoid forcing libvpx on machines that only run unit tests.
decode-integration = []

[dependencies]
# Internal
vc-common.workspace = true
vc-crypto = { workspace = true, features = ["megolm"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# Async
tokio.workspace = true
futures.workspace = true

# WebRTC
webrtc.workspace = true
smol_str.workspace = true

# Audio
cpal = "0.17"
opus = "0.3"
rodio = "0.22"
# nnnoiseless = "0.5"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
base64 = "0.22"

# HTTP
reqwest = { version = "0.13", features = ["json"] }

# WebSocket
tokio-tungstenite.workspace = true
url = "2"

# Secure Storage
# keyring 4 split its public API: this crate handles credential-store
# selection, while `keyring-core` exposes the `Entry`/`Error` types we use
# directly. Both need to be deps. App startup must call one of keyring's
# `use_*_store` functions (typically `use_native_store(false)`) before any
# `Entry::new` — see lib.rs setup callback.
keyring = "4"
keyring-core = "1"
# rusqlite stays on 0.32: cargo's `links = "sqlite3"` namespace conflicts
# with sqlx 0.8.x's transitive sqlx-sqlite (which pins libsqlite3-sys 0.30).
# rusqlite >= 0.33 requires libsqlite3-sys >= 0.31 and refuses to coexist —
# even though sqlx-sqlite is optional and unactivated in our config, cargo's
# resolver enforces `links` constraints globally across optional deps.
# Unblock requires sqlx 0.9 (currently only 0.9.0-alpha.1).
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio denoising + VAD
nnnoiseless = { version = "0.5", default-features = false }

# Screen capture
# Pinned to Detair/scap fork because upstream scap 0.1.0-beta.1 introduced a
# Frame enum restructure (Frame::Video(VideoFrame::*)) without updating the
# Linux pipewire backend, breaking the Linux build. Our fork (commit 4d1304e9)
# adapts the Linux backend to the new enum structure plus a Windows typo fix.
#
# Upstream tracking:
# - CapSoftware/scap#178 — broader fix, still open (last upstream update
#   2025-10-26)
# - Last re-check 2026-05-13: upstream latest release is still v0.1.0-beta.1
#   (2025-08-04). No new releases or merged Linux Frame enum fixes.
# - Previous re-check 2026-04-12: see closed PR #520 for the test run
# - Issue #521 tracks periodic re-checks — drop this git dep when upstream
#   publishes a new release with the Linux fix
scap = { git = "https://github.com/Detair/scap.git", branch = "fix/linux-frame-enum" }

# Webcam capture
nokhwa = { version = "0.10", features = ["input-native"] }

# Video encoding
vpx-encode = "0.6"
# Native VP8 decode path lives in a sub-crate so unsafe FFI is isolated from
# the workspace's `unsafe_code = "forbid"` policy. See client/src-tauri/vp8-decoder/.
kaiku-vp8-decoder = { path = "vp8-decoder" }

# Image encoding (thumbnails)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Process scanning
sysinfo = "0.39"

# Clipboard
arboard = "3"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2.workspace = true
getrandom = "0.2"
rand = "0.8"

# Zeroize
zeroize.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
sentry = { version = "0.48", features = ["tracing", "backtrace", "contexts", "panic"] }
sentry-tracing = "0.48"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[lib]
name = "vc_client"
crate-type = ["staticlib", "cdylib", "rlib"]
