# Vendored copy of env-libvpx-sys 5.1.3 (crates.io, MPL-2.0). Functional change:
# bindgen 0.68.1 -> 0.72.1 (plus `description`/`publish` metadata). Upstream (github.com/astraw/env-libvpx-sys) is
# archived. Since Clang 22 dropped ElaboratedType (llvm-project#147835),
# bindgen < 0.72.1 emits opaque `_address` stubs for typedef'd structs such
# as vpx_codec_enc_cfg / vpx_codec_dec_cfg (rust-bindgen#3275, fixed by
# #3278 in 0.72.1), which breaks vpx-encode. Wired in via [patch.crates-io]
# in the workspace Cargo.toml. See README.md before touching anything else.

[package]
name = "env-libvpx-sys"
authors = ["Richard Diamond <wichard@vitalitystudios.com>", "Kornel Lesiński <kornel@geekhood.net>", "Andrew Straw <strawman@astraw.com>"]
description = "Rust bindings to libvpx (vendored, bindgen 0.72)"
license = "MPL-2.0"
links = "vpx"
repository = "https://github.com/astraw/env-libvpx-sys"
version = "5.1.3"
edition = "2018"
publish = false

[build-dependencies]
pkg-config = "0.3.5"

[build-dependencies.bindgen]
optional = true
version = "0.72.1"

[features]
default = []
generate = ["bindgen"]

[lib]
name = "vpx_sys"
