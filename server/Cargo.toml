[package]
name = "vc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kaiku Server - Backend for voice and text communication"

[dependencies]
# Internal
vc-common.workspace = true
vc-crypto.workspace = true

# Async
tokio.workspace = true
futures.workspace = true

# Web
axum.workspace = true
axum-extra.workspace = true
time.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio-tungstenite.workspace = true

# WebRTC
webrtc.workspace = true

# Database
sqlx.workspace = true
fred.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true

# Auth
jsonwebtoken.workspace = true
argon2.workspace = true
totp-rs.workspace = true
# Terminal QR code of the CLI setup link (MIT; already in the tree via totp-rs).
qrcodegen = "1.8"
openidconnect.workspace = true

# Crypto
rustls.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
p256.workspace = true
# Android key attestation: read the leaf's KeyDescription (unverified chain, B.1)
x509-parser = { version = "0.16", default-features = false }
subtle = "2.6"
zeroize.workspace = true
url = "2.5"
aes-gcm.workspace = true

# Random
rand.workspace = true

# Utils
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
bytes.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
ipnet.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# OpenTelemetry
axum-tracing-opentelemetry.workspace = true
init-tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
tracing-opentelemetry-instrumentation-sdk.workspace = true

# S3
aws-sdk-s3.workspace = true
aws-config.workspace = true
aws-smithy-async.workspace = true
aws-smithy-types.workspace = true

# API
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# Markdown
pulldown-cmark.workspace = true

# Email
lettre.workspace = true

# Validation
validator.workspace = true

# MIME detection
mime_guess.workspace = true
infer.workspace = true

# Image processing
image.workspace = true
blurhash.workspace = true

# String matching
aho-corasick.workspace = true

# Unicode
unicode-segmentation = "1.12"

# Lock-free concurrent data structures
dashmap.workspace = true

# Bitflags
bitflags.workspace = true

# Archive
zip.workspace = true
tempfile.workspace = true

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# User-Agent parsing
woothee = "0.13"

# Config
dotenvy = "0.15"
tokio-util = { version = "0.7.18", features = ["io", "compat"] }

[dev-dependencies]
# Test attestation chains (key attestation fixtures)
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio-test = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
# Signing keys for the mock OIDC provider in tests (already in the tree via
# jsonwebtoken / openidconnect).
rsa = "0.9"

[lints]
workspace = true

[[bin]]
name = "vc-server"
path = "src/main.rs"

# Host CLI for key phones and sessions (`docker compose exec server kaiku-admin …`).
[[bin]]
name = "kaiku-admin"
path = "src/bin/kaiku_admin.rs"
