# Kaiku Production Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d                             (core services)
#      docker compose --profile monitoring up -d        (with monitoring)
#
# Required environment variables (see .env.example):
#   - DOMAIN: Your domain (e.g., chat.example.com)
#   - POSTGRES_PASSWORD: Strong database password
#   - JWT_PRIVATE_KEY/JWT_PUBLIC_KEY: Ed25519 key pair (base64-encoded PEM)
#   - ACME_EMAIL: Email for Let's Encrypt certificates
#   - VALKEY_PASSWORD: URL-safe (hex) password, e.g. `openssl rand -hex 24`
#   - CORS_ALLOWED_ORIGINS: https://<your domain>
#   - S3_ACCESS_KEY/S3_SECRET_KEY: object storage credentials
#   - PUBLIC_IP: public address of this host (voice media)

services:
  # ==========================================================================
  # Kaiku Server
  # ==========================================================================
  server:
    image: ghcr.io/detair/kaiku/server:latest
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: canis-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      - BIND_ADDRESS=0.0.0.0:8080
      - DATABASE_URL=postgres://voicechat:${POSTGRES_PASSWORD}@postgres:5432/voicechat
      - REDIS_URL=redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD}@valkey:6379
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-voicechat}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-}
      # Origins allowed by CORS. Desktop app origins are added by the server.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?set to https://<your domain>}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - STUN_SERVER=${STUN_SERVER:-stun:stun.l.google.com:19302}
      - TURN_SERVER=${TURN_SERVER:-}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-3600}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Public address advertised for voice media (TURN cannot relay to private addresses)
      - PUBLIC_IP=${PUBLIC_IP:-}
      # Voice media binds inside the published UDP range below (same variables)
      - VOICE_UDP_PORT_MIN=${RTP_PORT_MIN:-10000}
      - VOICE_UDP_PORT_MAX=${RTP_PORT_MAX:-10100}
      # Optional voice media tuning (empty = server default)
      - VOICE_ICE_INTERFACES=${VOICE_ICE_INTERFACES:-}
      - VOICE_ICE_IP_FAMILY=${VOICE_ICE_IP_FAMILY:-}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-}
      # Rate limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      # Only the compose network (where Caddy runs) may set forwarded headers
      - RATE_LIMIT_TRUSTED_PROXIES=${KAIKU_NET_SUBNET:-172.31.250.0/24}
      - RATE_LIMIT_ALLOWLIST=${RATE_LIMIT_ALLOWLIST:-}
      # Observability (enable with --profile monitoring)
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=vc-server
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - RUST_LOG=${RUST_LOG:-vc_server=info}
    ports:
      # WebRTC UDP ports for voice
      - "${RTP_PORT_MIN:-10000}-${RTP_PORT_MAX:-10100}:${RTP_PORT_MIN:-10000}-${RTP_PORT_MAX:-10100}/udp"
    networks:
      - voicechat

  # ==========================================================================
  # PostgreSQL Database (Bitnami hardened image)
  # ==========================================================================
  postgres:
    image: bitnami/postgresql:latest
    container_name: canis-postgres
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=voicechat
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=voicechat
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - voicechat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicechat -d voicechat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Valkey (Redis-compatible, BSD-3-Clause licensed)
  # ==========================================================================
  valkey:
    image: bitnami/valkey:latest
    container_name: canis-valkey
    restart: unless-stopped
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    volumes:
      - valkey_data:/bitnami/valkey/data
    networks:
      - voicechat
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # RustFS — S3-compatible object storage (uploads, avatars, emoji)
  # ==========================================================================
  # NOTE: added 2026-06-12 from the dev template because the live VPS runs
  # canis-rustfs but this file never defined it — a fresh VPS could not be
  # rebuilt from the repo. Before relying on this definition, verify it
  # against the running container (image tag, env, volume):
  #   docker inspect canis-rustfs --format '{{.Config.Image}} {{.Mounts}}'
  rustfs:
    image: rustfs/rustfs:latest
    container_name: canis-rustfs
    restart: unless-stopped
    command: /data
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    networks:
      - voicechat
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Kaiku Web — the web client (static files, nginx, port 8080)
  # ==========================================================================
  web:
    # latest = newest final release; set KAIKU_VERSION (e.g. 1.0.0-rc.2) to
    # run a release candidate, which is published under its version only.
    image: ghcr.io/detair/kaiku-web:${KAIKU_VERSION:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
    container_name: canis-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Origins (space separated) of a separate files/S3 host that serves
      # attachments, e.g. https://files.example.com. Empty when files come
      # from this domain.
      - KAIKU_MEDIA_ORIGINS=${KAIKU_MEDIA_ORIGINS:-}
    networks:
      - voicechat

  # ==========================================================================
  # Caddy — Reverse Proxy (server paths to the server, the rest to web)
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: canis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    networks:
      - voicechat

  # ==========================================================================
  # coturn — STUN/TURN Server for NAT Traversal
  # ==========================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: canis-coturn
    restart: unless-stopped
    command:
      - "-n"
      - "--realm=${DOMAIN}"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
      - "--external-ip=${PUBLIC_IP}"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--log-file=stdout"
      - "--no-cli"
      # Do not relay to private, loopback or link-local peers
      - "--no-multicast-peers"
      - "--no-tcp-relay"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    # Isolated from the application network
    networks:
      - turn

  # ==========================================================================
  # OTel Collector (monitoring profile — opt-in)
  # Start with: docker compose --profile monitoring up -d
  # ==========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    container_name: canis-otel-collector
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (localhost only)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (localhost only)
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint
    networks:
      - voicechat

  # ==========================================================================
  # Prometheus (monitoring profile)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: canis-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - voicechat

  # ==========================================================================
  # Grafana Tempo — Trace Storage (monitoring profile)
  # ==========================================================================
  tempo:
    image: grafana/tempo:2.4.0
    container_name: canis-tempo
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - voicechat

  # ==========================================================================
  # Grafana Loki — Log Aggregation (monitoring profile)
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: canis-loki
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - voicechat

  # ==========================================================================
  # Grafana — Dashboards (monitoring profile)
  # Access via Netbird VPN at http://localhost:3000
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: canis-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - voicechat
    depends_on:
      - prometheus
      - tempo
      - loki

networks:
  voicechat:
    driver: bridge
    ipam:
      config:
        - subnet: ${KAIKU_NET_SUBNET:-172.31.250.0/24}
  turn:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
