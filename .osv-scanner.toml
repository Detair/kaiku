# ---------------------------------------------------------------------------
# vite dev-server CVEs — the application's own vite is upgraded to 8.0.16
# (patched). The only affected instance left is vite 7.3.1, nested under
# vitest for the test runner. Every one of these advisories requires a
# running `vite dev` server (file-serving / server.fs.deny bypass /
# __open-in-editor), none of which vitest exposes. The fixes (vite 7.3.2 and
# 7.3.5) cannot be adopted because the vite that vitest 4.1.x is compatible
# with breaks vite-plugin-solid's JSX transform — the same nested-vite compat
# wall first documented in PR #517 (the test config has no solid plugin and
# relies on the nested vite's esbuild for the imported .tsx JSX, which
# regresses on vite > 7.3.1). Re-evaluate when vitest ships a release whose
# vite is ≥7.3.5 and JSX-compatible.
# ---------------------------------------------------------------------------

# Fixed in vite 7.3.2 (originally accepted in PR #517):
